name: Hestia cache repro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  repro:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cheap baseline: GitHub's real cache backend.
          - name: github-ubuntu-x64
            runner: ubuntu-latest

          # Blacksmith's Linux cache path.
          - name: blacksmith-ubuntu-x64
            runner: blacksmith-2vcpu-ubuntu-2404

          # Exact-ish reproduction for your aarch64-darwin log.
          # GitHub macos-15 is arm64; Blacksmith macos-15 is Apple Silicon.
          - name: github-macos-arm
            runner: macos-15

          - name: blacksmith-macos-arm
            runner: blacksmith-6vcpu-macos-15

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    env:
      NIX_CONFIG: |
        extra-experimental-features = nix-command flakes

    steps:
      - uses: actions/checkout@v6

      - uses: NixOS/nix-installer-action@main

      - name: Runner/cache diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          nix --version
          nix eval --raw --impure --expr 'builtins.currentSystem'

          python3 - <<'PY'
import os
import urllib.parse

for name in [
    "ACTIONS_RESULTS_URL",
    "ACTIONS_CACHE_URL",
    "ACTIONS_RUNTIME_URL",
]:
    value = os.environ.get(name)
    if not value:
        print(f"{name}=<unset>")
    else:
        parsed = urllib.parse.urlparse(value)
        print(f"{name}.scheme={parsed.scheme}")
        print(f"{name}.netloc={parsed.netloc}")
PY

      - uses: Mic92/hestia@v1
        with:
          version: v1.0.4
          drain-timeout: 600
          upstream-cache-filter: true

      - name: Build cached Nix output
        shell: bash
        run: |
          set -euxo pipefail

          out="$(nix build .# --print-build-logs --no-link --print-out-paths)"

          echo "out=$out"
          du -sh "$out" || true
          ls -lah "$out"
          test -f "$out/result.txt"
