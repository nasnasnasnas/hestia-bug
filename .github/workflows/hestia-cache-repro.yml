name: Hestia cache repro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  repro:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: github-ubuntu-x64
            runner: ubuntu-latest

          - name: blacksmith-ubuntu-x64
            runner: blacksmith-2vcpu-ubuntu-2404

          - name: github-macos-arm
            runner: macos-15

          - name: blacksmith-macos-arm
            runner: blacksmith-6vcpu-macos-15

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    env:
      NIX_CONFIG: |
        extra-experimental-features = nix-command flakes

    steps:
      - uses: actions/checkout@v6

      - uses: NixOS/nix-installer-action@main

      - name: Runner/cache diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          nix --version
          nix eval --raw --impure --expr 'builtins.currentSystem'

          for name in ACTIONS_RESULTS_URL ACTIONS_CACHE_URL ACTIONS_RUNTIME_URL; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "$name=<unset>"
            else
              echo "$name=$value"
            fi
          done

      - uses: nealol/hestia@1.0.4-blacksmith.1
        with:
          version: 1.0.4-blacksmith.1
          drain-timeout: 600
          upstream-cache-filter: true

      - name: Build cached Nix output
        shell: bash
        run: |
          set -euxo pipefail

          out="$(nix build .# --print-build-logs --no-link --print-out-paths)"

          echo "out=$out"
          du -sh "$out" || true
          ls -lah "$out"
          test -f "$out/result.txt"
